<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noor Aesthetic</title>
  <style>
    body { background: #1a001a; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
    h1 { color: #ff4dd2; }
    input, select, button { width: 90%; padding: 15px; margin: 10px 0; border-radius: 25px; border: 2px solid #ff4dd2; background: #2d002d; color: white; font-size: 16px; }
    button { background: linear-gradient(45deg, #ff4dd2, #4d79ff); border: none; font-weight: bold; cursor: pointer; }
    #result { margin-top: 20px; padding: 20px; background: #2d002d; border-radius: 15px; min-height: 200px; display: none; }
  </style>
</head>
<body>
  <h1>✨ NOOR AESTHETIC ✨</h1>
  <p>Daily Vibe + Quotes + Wallpapers<br>By @kashan_badshah</p>
  
  <div id="result"></div>
  
  <input type="text" id="name" placeholder="Apna naam: Ayesha">
  
  <select id="mood">
    <option value="">Aaj ka Mood Kya Hai? 🎭</option>
    <option value="sad">Sad Girl Era 😢</option>
    <option value="healing">Healing Era 🌸</option>
    <option value="main">Main Character Energy 👑</option>
    <option value="soft">Soft Girl Vibes 🦋</option>
  </select>
  
  <button onclick="generateVibe()">✨ Vibe Generate Karo</button>

  <script>
    const vibes = {
      sad: {quote: "Ayesha, aansu bhi khoobsurat hote hain jab woh dil se niklein.", color: "#4d0026"},
      healing: {quote: "Ayesha, tu toot ke bhi chamakti hai. Healing tera superpower hai.", color: "#00264d"},
      main: {quote: "Ayesha, duniya teri movie hai. Tu heroine hai, side character nahi.", color: "#4d004d"},
      soft: {quote: "Ayesha, teri softness teri kamzori nahi, teri taqat hai.", color: "#331a00"}
    };
    
    function generateVibe() {
      const name = document.getElementById('name').value || 'Badshah';
      const mood = document.getElementById('mood').value;
      const result = document.getElementById('result');
      
      if (!mood) {
        alert('Pehle mood select kar Badshah!');
        return;
      }
      
      const vibe = vibes[mood];
      result.style.display = 'block';
      result.style.background = vibe.color;
      result.innerHTML = `<h2>${name.toUpperCase()}</h2><p style="font-size:18px;">${vibe.quote.replace('Ayesha', name)}</p>`;
    }
  </script>
</body>
</html>
